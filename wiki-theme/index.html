		<!--
			Paste this block verbatim into Bear's dashboard under
			Settings → Header directive (paid accounts only — it's rendered
			with |safe on home.html, post.html and posts.html, so it runs
			site-wide and skips clean()).

			Groups a single {{ posts }} list into <h3> year headings, and
			reformats each date to "12th April" — the year lives in the
			heading instead. Post pages have no ul.blog-posts, so their dates
			are left completely alone and keep the year.
		-->
		<script>
			(function () {
				"use strict";

				var MONTHS = [
					"Jan", "Feb", "Mar", "Apr", "May", "Jun",
					"Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
				];

				// Zero-padded day + 3-letter month, so every date is the same
				// character count ("02 Feb", "12 Apr"). Equivalent to Bear's
				// "d M" format string, but applied only to the index list so
				// post pages keep the year.
				function dayMonth(d) {
					var day = String(d.getDate());
					if (day.length < 2) day = "0" + day;
					return day + " " + MONTHS[d.getMonth()];
				}

				function groupPostsByYear() {
					// :not([data-grouped]) keeps this idempotent — the lists it
					// generates are skipped if it ever runs twice.
					var lists = document.querySelectorAll(
						"ul.blog-posts:not([data-grouped])"
					);

					Array.prototype.forEach.call(lists, function (list) {
						var order = [];
						var byYear = {};

						Array.prototype.forEach.call(
							list.querySelectorAll("li"),
							function (li) {
								// datetime is always the full ISO timestamp, set
								// server-side and never rewritten by Bear's own
								// date formatter (which only touches innerText).
								var t = li.querySelector("time[datetime]");
								if (!t) return;
								var d = new Date(t.dateTime);
								if (isNaN(d.getTime())) return;

								var y = d.getFullYear();
								if (!byYear[y]) {
									byYear[y] = [];
									order.push(y);
								}
								byYear[y].push({ li: li, date: d, time: t });
							}
						);

						if (!order.length) return;

						var frag = document.createDocumentFragment();

						// Years are emitted in document order, so Bear's own
						// order: parameter is respected rather than overridden.
						order.forEach(function (year) {
							var h = document.createElement("h3");
							h.textContent = year;
							frag.appendChild(h);

							var ul = document.createElement("ul");
							ul.className = list.className;
							ul.setAttribute("data-grouped", "1");

							byYear[year].forEach(function (entry) {
								entry.time.textContent = dayMonth(entry.date);

								// Bear emits <span>date</span> before <a>title</a>.
								// Move the date to the end of the <li> so it reads
								// "Title (12 Apr)". Doing this in the DOM keeps the
								// native list marker — reordering inline children in
								// CSS would need flexbox, which drops the bullet.
								var dateSpan = entry.time.closest("span");
								if (dateSpan) entry.li.appendChild(dateSpan);

								ul.appendChild(entry.li);
							});

							frag.appendChild(ul);
						});

						list.parentNode.replaceChild(frag, list);
					});
				}

				// Exposed so the local dev env can re-run it after content.md
				// is injected — innerHTML-inserted <script> tags never execute,
				// and the async fetch resolves after DOMContentLoaded anyway.
				window.groupPostsByYear = groupPostsByYear;

				if (document.readyState === "loading") {
					document.addEventListener("DOMContentLoaded", groupPostsByYear);
				} else {
					groupPostsByYear();
				}
			})();
		</script>
		<!--
			Second header-directive block: the typeahead search box.
			Injected into <header> between the title and the nav, because Bear's
			header markup can't be edited directly.

			Index comes from the post list already in the DOM when there is one
			(homepage, /blog/), otherwise from /feed/ — Bear's Atom feed carries
			both titles and tags (feed.py emits fe.category(term=...)), so search
			works on post pages too. Built lazily on first keystroke, which also
			sidesteps the local dev env's async content.md load.
		-->
		<script>
			(function () {
				"use strict";

				var MAX_RESULTS = 5;
				var index = null;
				var indexPromise = null;

				function fromDom() {
					var out = [];
					var nodes = document.querySelectorAll("ul.blog-posts li");
					Array.prototype.forEach.call(nodes, function (li) {
						var a = li.querySelector("a[href]");
						if (!a) return;
						out.push({
							title: a.textContent.trim(),
							href: a.getAttribute("href"),
							tags: (li.getAttribute("data-tags") || "")
								.split(",")
								.filter(Boolean),
						});
					});
					return out;
				}

				function fromFeed(xmlText) {
					var doc = new DOMParser().parseFromString(xmlText, "application/xml");
					var out = [];
					Array.prototype.forEach.call(
						doc.querySelectorAll("entry"),
						function (e) {
							var title = e.querySelector("title");
							var link = e.querySelector("link");
							if (!title || !link) return;
							var tags = [];
							Array.prototype.forEach.call(
								e.querySelectorAll("category"),
								function (c) {
									var t = c.getAttribute("term");
									if (t) tags.push(t);
								}
							);
							out.push({
								title: title.textContent.trim(),
								href: link.getAttribute("href"),
								tags: tags,
							});
						}
					);
					return out;
				}

				function getIndex() {
					if (index) return Promise.resolve(index);
					if (indexPromise) return indexPromise;

					var dom = fromDom();
					if (dom.length) {
						index = dom;
						return Promise.resolve(index);
					}

					indexPromise = fetch("/feed/")
						.then(function (r) {
							return r.text();
						})
						.then(function (xml) {
							index = fromFeed(xml);
							return index;
						})
						.catch(function () {
							index = [];
							return index;
						});
					return indexPromise;
				}

				// Title prefix beats title substring beats tag match. Ties keep
				// document order, which is Bear's chronological ordering.
				function rank(items, q) {
					var query = q.toLowerCase();
					var hits = [];
					items.forEach(function (item, i) {
						var title = item.title.toLowerCase();
						var score = 0;
						if (title.indexOf(query) === 0) score = 3;
						else if (title.indexOf(query) > -1) score = 2;
						else if (
							item.tags.some(function (t) {
								return t.toLowerCase().indexOf(query) > -1;
							})
						)
							score = 1;
						if (score) hits.push({ item: item, score: score, order: i });
					});
					hits.sort(function (a, b) {
						return b.score - a.score || a.order - b.order;
					});
					return hits.slice(0, MAX_RESULTS).map(function (h) {
						return h.item;
					});
				}

				function build() {
					var header = document.querySelector("header");
					if (!header || header.querySelector(".wiki-search")) return;

					var box = document.createElement("div");
					box.className = "wiki-search";
					box.innerHTML =
						'<div class="wiki-search-inner">' +
						'<input type="search" class="wiki-search-input" autocomplete="off"' +
						' placeholder="Search paultreanor.com" aria-label="Search"' +
						' role="combobox" aria-autocomplete="list" aria-expanded="false"' +
						' aria-controls="wiki-search-results">' +
						'<button type="button" class="wiki-search-button">Search</button>' +
						"</div>" +
						'<ul class="wiki-search-results" id="wiki-search-results"' +
						' role="listbox" hidden></ul>';

					header.insertBefore(box, header.querySelector("nav"));

					var input = box.querySelector(".wiki-search-input");
					var button = box.querySelector(".wiki-search-button");
					var list = box.querySelector(".wiki-search-results");
					var current = [];
					var active = -1;

					function close() {
						list.hidden = true;
						list.innerHTML = "";
						current = [];
						active = -1;
						input.setAttribute("aria-expanded", "false");
						input.removeAttribute("aria-activedescendant");
					}

					function highlight(i) {
						var options = list.querySelectorAll('[role="option"]');
						if (!options.length) return;
						if (active > -1 && options[active])
							options[active].setAttribute("aria-selected", "false");
						active = (i + options.length) % options.length;
						options[active].setAttribute("aria-selected", "true");
						input.setAttribute("aria-activedescendant", options[active].id);
					}

					function render(results) {
						current = results;
						active = -1;
						if (!results.length) return close();

						list.innerHTML = results
							.map(function (r, i) {
								return (
									'<li role="option" aria-selected="false"' +
									' id="wiki-search-opt-' +
									i +
									'"><a href="' +
									r.href +
									'"><span class="wiki-search-title"></span>' +
									'<span class="wiki-search-tags"></span></a></li>'
								);
							})
							.join("");

						// textContent, not innerHTML — titles are untrusted strings.
						Array.prototype.forEach.call(
							list.querySelectorAll('[role="option"]'),
							function (li, i) {
								li.querySelector(".wiki-search-title").textContent =
									results[i].title;
								li.querySelector(".wiki-search-tags").textContent =
									results[i].tags.join(", ");
							}
						);

						list.hidden = false;
						input.setAttribute("aria-expanded", "true");
					}

					function go() {
						var pick = active > -1 ? current[active] : current[0];
						if (pick) window.location.href = pick.href;
					}

					input.addEventListener("input", function () {
						var q = input.value.trim();
						if (!q) return close();
						getIndex().then(function (idx) {
							if (input.value.trim() !== q) return; // stale response
							render(rank(idx, q));
						});
					});

					input.addEventListener("keydown", function (e) {
						if (e.key === "ArrowDown") {
							e.preventDefault();
							highlight(active + 1);
						} else if (e.key === "ArrowUp") {
							e.preventDefault();
							highlight(active - 1);
						} else if (e.key === "Enter") {
							// No results page exists, so Enter only ever follows a
							// suggestion — it never navigates to a dead search URL.
							e.preventDefault();
							go();
						} else if (e.key === "Escape") {
							close();
						}
					});

					button.addEventListener("click", go);

					document.addEventListener("click", function (e) {
						if (!box.contains(e.target)) close();
					});
				}

				window.buildWikiSearch = build;

				if (document.readyState === "loading") {
					document.addEventListener("DOMContentLoaded", build);
				} else {
					build();
				}
			})();
		</script>
	</head>

	<body

		<script>
			window.addEventListener("load", () => {
				if (navigator.webdriver !== true) {
					const sendHit = (score) => {
						const params = new URLSearchParams({
							blog: "paultreanor",
							token: "/",
							referrer: document.referrer.includes("paultreanor.bearblog.dev")
								? ""
								: document.referrer,
							title: "",
							score: score,
						});
						new Image().src = `/hit/?${params.toString()}`;
					};

					document.addEventListener("touchmove", () => sendHit(100), {
						once: true,
					});
					document.addEventListener("mousemove", () => sendHit(100), {
						once: true,
					});
				}
			});
		</script>

		<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
		<script>
			fetch("content.md")
				.then((res) => res.text())
				.then((markdown) => {
					document.getElementById("content").innerHTML = marked.parse(markdown);
					// Local-env only. On the real blog Bear renders {{ posts }}
					// server-side, so the DOMContentLoaded handler is enough.
					window.groupPostsByYear();
				});
		</script>
		<footer>
			<span>

				<a href="https://bearblog.dev"
					>Bear

						>ʕ•ᴥ•ʔ</span
					></a
				>
			</span>
		</footer>

		<script>
			(() => {
				"use strict";
				const times = document.querySelectorAll("time");
				const format_string = "d M, Y" || "d M, Y";

				times.forEach((time) => {
					time.innerText = formatDate(time.dateTime, format_string);
				});

				function formatDate(dateStr, formatStr) {
					const date = new Date(dateStr);
					const day = date.getDate();
					const month = date.getMonth();
					const year = date.getFullYear();
					const weekday = date.getDay();
					const hours = date.getHours();
					const minutes = date.getMinutes();
					const monthsFull = [
						"January",
						"February",
						"March",
						"April",
						"May",
						"June",
						"July",
						"August",
						"September",
						"October",
						"November",
						"December",
					];
					const monthsShort = [
						"Jan",
						"Feb",
						"Mar",
						"Apr",
						"May",
						"Jun",
						"Jul",
						"Aug",
						"Sep",
						"Oct",
						"Nov",
						"Dec",
					];
					const daysFull = [
						"Sunday",
						"Monday",
						"Tuesday",
						"Wednesday",
						"Thursday",
						"Friday",
						"Saturday",
					];
					const daysShort = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

					function getOrdinal(n) {
						const s = ["th", "st", "nd", "rd"];
						const v = n % 100;
						return s[(v - 20) % 10] || s[v] || s[0];
					}

					const map = {
						d: () => day.toString().padStart(2, "0"),
						m: () => (month + 1).toString().padStart(2, "0"),
						Y: () => year.toString(),
						y: () => year.toString().slice(-2),
						F: () => monthsFull[month],
						j: () => day.toString(),
						D: () => daysShort[weekday],
						l: () => daysFull[weekday],
						S: () => getOrdinal(day),
						M: () => monthsShort[month],
						H: () => hours.toString().padStart(2, "0"),
						h: () => {
							let h = hours % 12;
							h = h === 0 ? 12 : h;
							return h.toString().padStart(2, "0");
						},
						g: () => {
							let h = hours % 12;
							return h === 0 ? "12" : h.toString();
						},
						i: () => minutes.toString().padStart(2, "0"),
						a: () => (hours < 12 ? "am" : "pm"),
						A: () => (hours < 12 ? "AM" : "PM"),
					};

					let result = "";
					for (let char of formatStr) {
						result += map[char] ? map[char]() : char;
					}
					return result;
				}
			})();
		</script>
